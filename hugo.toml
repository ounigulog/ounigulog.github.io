baseURL = 'https://ounigulog.github.io/'
theme = 'hugo-theme-reimu'
locale = 'zh-CN'
defaultContentLanguage = 'zh-CN'
enableEmoji = true
enableGitInfo = true
[languages]
[languages.zh-CN]
label = '简体中文'
weight = 1
hasCJKLanguage = true
title = 'Ounigulog'
author = 'Ounigulog'

[languages.zh-TW]
label = '繁體中文'
weight = 2
hasCJKLanguage = true
title = 'Ounigulog'
author = 'Ounigulog'

[languages.en]
label = 'English'
weight = 3
title = 'Ounigulog'
author = 'Ounigulog'

[languages.ja]
label = '日本語'
weight = 4
hasCJKLanguage = true
title = 'Ounigulog'
author = 'Ounigulog'

[markup.highlight]
guessSyntax = true
noClasses = false

[markup.goldmark.extensions.passthrough]
enable = true
delimiters.block = [["\\[", "\\]"], ["$$", "$$"]]
delimiters.inline = [["\\(", "\\)"], ["$", "$"]]

[outputs]
home = ["Algolia", "HTML", "RSS"]

[outputFormats.Algolia]
baseName = "algolia"
isPlainText = true
mediaType = "application/json"
notAlternative = true

[markup]
  [markup.tableOfContents]
    endLevel = 4
    ordered = true
    startLevel = 1
