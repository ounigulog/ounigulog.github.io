########################################
# 实验性功能
########################################

# 自定义 HTML 注入点
# 注入代码须为 safeHTML
injector:  # HTML 注入
  head_begin: # 在 <head> 开始标签后注入代码
  head_end: # 在 </head> 结束前注入代码
  body_begin: # 在 <body> 开始标签后注入代码
  body_end: # 在 </body> 结束前注入代码
  sidebar_begin: # 在 <aside> 开始标签后注入代码
  sidebar_end: # 在 </aside> 结束前注入代码

# 实验功能，可能有 bug，请谨慎开启
pjax:  # PJAX 无刷新
  enable: false  # 是否启用（本行含义视上下文而定）

# 实验性功能
# Quicklink 预加载库
quicklink:  # 链接预加载
  enable: false  # 是否启用（本行含义视上下文而定）
  # requestIdleCallback 超时（毫秒）
  timeout: 3000
  # 是否高优先级预取链接
  # true 时优先使用 fetch 预取
  priority: true
  # 判断哪些 URL 需要预取
  # ignores 仅支持字符串
  ignores: []

# 实验性功能
service_worker:  # Service Worker
  enable: false  # 是否启用（本行含义视上下文而定）

# 实验性功能
live2d:  # Live2D 看板娘
  enable: false  # 是否启用（本行含义视上下文而定）
  position: left # 显示在左侧或右侧

# 实验性功能
live2d_widgets:  # Live2D 挂件
  enable: false  # 是否启用（本行含义视上下文而定）
  position: left # 显示在左侧或右侧

# Pace 顶部进度条
pace:  # 顶部加载进度条
  enable: true  # 显示三角徽标

# 实验性功能
# 使用播放器建议先开启 pjax
player:  # 音乐播放器
  disable_on_mobile: false
  position: before_sidebar # 播放器位置选项
  # 启用 Meting 须先启用 APlayer
  aplayer:  # APlayer 播放器
    # APlayer 项目
    enable: false
    options:
      audio: []
      fixed: true
      autoplay:
      loop:
      order:
      preload:
      volume:
      mutex:
      listFolded:
      lrcType:
  meting:  # Meting 在线歌单
    # MetingJS 项目
    # 使用 Meting 须先启用 APlayer
    enable: false
    meting_api: # 自定义 Meting API 地址
    options:
      id: 2265921590
      server: netease
      type: playlist
      auto:

