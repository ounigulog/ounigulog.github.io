########################################
# 基础配置
########################################

# 顶部主导航菜单配置
# 菜单图标说明见主题 Issue #30
menu:  # 菜单项列表
  - name: home  # 首页菜单
    url: ""  # 链接为空表示站点根路径
    icon: # 留空使用默认太极图标，可填 FontAwesome 或 iconfont 十六进制
  - name: categories # 导航项：分类列表页
    url: "categories"  # 分类页路径
    icon:  # 菜单图标，留空用默认
  - name: archives  # 归档页菜单
    url: "archives"  # 归档页路径
    icon:  # 菜单图标，留空用默认
  - name: about  # 关于页菜单
    url: "about"  # 关于页路径
    icon:  # 菜单图标，留空用默认
  - name: friend  # 友链页菜单
    url: "friend"  # 友链页路径
    icon:  # 菜单图标，留空用默认

mainSections: ["post"]  # 首页文章列表使用的 content section
# 年、月、日及时间的格式化样式
# Go 语言时间格式说明
yearFormat: "2006"  # 年份显示格式
monthFormat: "2006-01"  # 年月显示格式
dateFormat: "2006-01-02"  # 日期显示格式
timeFormat: "2006-01-02 15:04:05"  # 日期时间显示格式

author: Ounigulog  # 站点作者名称
email: 2144253736@qq.com  # 作者联系邮箱
description: "无言"  # 站点描述文字
# 静态副标题示例（已注释）
subtitle:  # 首页副标题配置
  typing:  # 打字机效果
    enable: true  # 启用打字机
    strings:  # 轮播句子列表
      line1:  # 第一行（中文）
        - 本是清汤无盐面，泪落碗中方知咸
        - 233
        - 呃呃
        - 如此这般
      line2:  # 第二行（原文，字号较小）
        - Clear soup seemed bland, until tears fell into the bowl
        - two three three
        - eh eh
        - just like that
    typeSpeed: 100              # 打字速度（毫秒/字符） 
    backSpeed: 50               # 删除速度（毫秒/字符）
    backDelay: 2000             # 打完一句话后，等待时间
    startDelay: 300             # 页面加载后，等待时间
    loop: true                  # 是否循环播放
    shuffle: true              # 是否随机输出句子
    showCursor: true            # 是否显示闪烁的字符
    cursorChar: "|"             # 字符
    smartBackspace: false       # 智能退格，只删除不同的部分
  text: "少女祈祷中..."        # 当 typing.enable = false 时使用

banner: "images/banner.webp"  # 站点顶部头图路径
# 头图也可使用完整 URL
# 外链头图示例（已注释）

# 启用响应式头图需打开 banner_srcset
banner_srcset:  # 响应式头图配置
  enable: false  # 是否启用（本行含义视上下文而定）
  srcset:  # 各断点对应图片列表
    - src: "images/banner-600w.webp"  # 小屏头图文件
      media: "(max-width: 479px)"  # 超小屏媒体查询
    - src: "images/banner-800w.webp"  # 中屏头图文件
      media: "(max-width: 799px)"  # 中屏媒体查询
    - src: "images/banner.webp"  # 大屏头图文件
      media: "(min-width: 800px)"  # 大屏及以上媒体查询

avatar: "sln.jpg"  # 侧栏头像文件名

# 控制文章封面显示
# 未设置时默认使用站点头图
# 优先级低于文章 Front matter 的 cover
cover: # 可填 URL、false 或 rgb 纯色

# 控制文章目录显示
# 优先级低于文章 Front matter 的 toc
toc: true  # 全局启用文章目录

# Open Graph 社交分享元数据
open_graph:  # Open Graph 配置块
  enable: true  # 显示三角徽标
  options:  # 动画分区配置
    #twitter_card: <twitter:card>
    #twitter_id: <twitter:creator>
    #twitter_site: <twitter:site>
    #twitter_image: <twitter:image>
    #google_plus: <g+:profile_link>
    #fb_admins: <fb:admin_id>
    #fb_app_id: <fb:app_id>

# 内容相关配置
excerpt_link: Read More  # 列表摘要「阅读更多」文字

# 页脚版权区域
# 在页脚版权处注入 HTML 代码
# 注入代码须为 safeHTML
copyright:  # 自定义页脚版权 HTML
# 协议选择参考下方链接
# CC 协议选择页
# 开源协议选择页
# copyright: |-
#   <div style="flex-direction:column;align-items: center;"><a rel="license" href="http://creativecommons.org/licenses/by/4.0/"><img alt="Creative Commons License" style="border-width:0" src="https://i.creativecommons.org/l/by/4.0/88x31.png" /></a>
#   All website licensed under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank">CC BY 4.0</a></div>

footer:  # 页脚配置
  since: 2026 # 版权栏显示的起始年份
  powered: true  # 显示 Powered by 信息
  count: true  # 显示全站字数与阅读时间
  busuanzi: true  # 启用不蒜子访问统计
  icon:  # 页脚装饰图标
    url: "../images/taichi.png" # 路径相对于 css/main.css，需向上一级找 images
    rotate: true  # 图标旋转动画
    mask: true # 是否将图片作为 CSS 遮罩显示轮廓

# 侧栏配置
# 已废弃：请使用 sidebar.position
sidebar:  # 侧栏布局
  position: left  # 侧栏显示在左侧
  menu: true # 是否显示侧栏菜单按钮，移动端无效
  article:  # 正文字体配置
    show_common: true # 文章页是否显示通用侧栏，移动端无效

social:  # 侧栏社交链接
   email: 2144253736@qq.com
   github: https://github.com/ounigulog
  # google: https://plus.google.com/yourname
  # twitter: https://twitter.com/yourname
  # bluesky: https://bsky.app/profile/yourname
  # facebook: https://www.facebook.com/yourname
  # instagram: https://www.instagram.com/yourname
  # linkedin: https://www.linkedin.com/in/yourname
  # pinterest: https://www.pinterest.com/yourname
  # youtube: https://www.youtube.com/channel/yourname
  # vimeo: https://vimeo.com/yourname
  # flickr: https://www.flickr.com/photos/yourname
  # dribbble: https://dribbble.com/yourname
  # behance: https://www.behance.net/yourname
  # bilibili: https://space.bilibili.com/yourname
  # weibo: https://weibo.com/yourname
  # zhihu: https://www.zhihu.com/people/yourname
  # reddit: https://www.reddit.com/user/yourname
  # tumblr: https://yourname.tumblr.com
  # medium: https://medium.com/@yourname
  # deviantart: https://yourname.deviantart.com
  # stackoverflow: https://stackoverflow.com/users/yourname
  # keybase: https://keybase.io/yourname
  # telegram: https://t.me/yourname
  # discord: https://discordapp.com/users/yourname
  # steam: https://steamcommunity.com/id/yourname
  # weixin: 
  # qq:
  # tiktok:

widgets:  # 侧栏小部件列表
  - category  # 显示分类小部件
  - tag  # 显示标签小部件
  - tagcloud  # 显示标签云
  - recent_posts  # 显示最近文章

# 侧栏小部件数量限制
category_limits: 10  # 侧栏最多显示分类数
tag_limits: 10  # 侧栏最多显示标签数
recent_posts_limits: 5  # 最近文章条数上限
tagcloud_limits: 20  # 标签云标签数上限

# 归档与分类胶囊显示行为
only_show_capsule_in_index: false # 标签/分类很多时可设 true，仅首页显示胶囊以提升性能
uppercase_capsule: true # false 保持分类/标签胶囊原文大小写

show_update_time: true # 是否在列表和文章中显示最后更新时间

# 文章摘要显示
summary:  # 摘要配置
  enable: false  # 是否启用（本行含义视上下文而定）
  style: 'subtitle' # 摘要样式：副标题或块引用

# RSS 订阅输出
rss:  # RSS 配置
  limit: 10 # RSS 输出最近文章数，-1 为全部
  showFullContent: false # RSS 输出全文或仅摘要
  showCopyright: false # true 时在 RSS 文末附加版权声明

# 列表排序方式配置
# 可选值：default、date、date-reverse、weight、weight-reverse
# default 为 Hugo 默认排序
# date 按日期升序（旧文在前）
# date-reverse 按日期降序（新文在前）
# weight 按权重升序
# weight-reverse 按权重降序
sort_order:  # 排序配置
  taxonomy:  # 分类与标签页排序
    category: date-reverse # 受分类 weight 字段控制排序
    tag: date-reverse # 受标签 weight 字段控制排序
  archive: date-reverse # 受文章 weight 字段控制排序
  home: default # 受文章 weight 字段控制排序

# 分页条数配置
paginate:  # 分页配置
  archive: 15 # 归档页与分类/标签页每页文章数
  post: 10 # 首页等列表每页文章数

########################################
# 样式与布局
########################################

layout:  # 页面布局
  max_width: 1350px # 主内容区域最大宽度

triangle_badge:  # 右上角三角徽标
  enable: true  # 显示三角徽标
  icon: github # 图标名与 social 配置中一致
  link: https://github.com/ounigulog  # 徽标点击跳转链接

anchor_icon: # 默认 # 锚点图标，可填图标码或 false 隐藏

reimu_cursor:  # 灵梦风格鼠标指针
  enable: true  # 显示三角徽标
  cursor:  # 各状态光标图片
    default: ../images/cursor/reimu-cursor-default.png # 路径相对于 css/main.css，需向上一级找 images
    pointer: ../images/cursor/reimu-cursor-pointer.png
    text: ../images/cursor/reimu-cursor-text.png

icon_font: 4552607_ex15nbittbh  # iconfont 项目 ID

# 字体加载优先级策略
# 顺序：自定义字体 → Google Fonts → 本地回退

# 自定义字体
custom_font:  # 自定义字体
  enable: false  # 是否启用（本行含义视上下文而定）
  article:  # 正文字体配置
    # - css: https://fontsapi.zeoseven.com/292/main/result.css # font css
    #   name: LXGW WenKai # font name
  code:  # 代码字体配置

# Google Fonts 官网
# Google Fonts 优先于 local_font
font:  # Google 字体
  enable: true  # 显示三角徽标
  article:  # 正文字体配置
    - Mulish
    - Noto Serif SC
  code:  # 代码字体配置
    # - Ubuntu Mono
    # - Source Code Pro
    # - JetBrains Mono

# 本地回退字体
local_font:  # 本地回退字体
  article:  # 正文字体配置
    - "-apple-system"
    - PingFang SC
    - Microsoft YaHei
    - sans-serif
  code:  # 代码字体配置
    - Menlo
    - Monaco
    - Consolas
    - monospace

dark_mode:  # 深色模式
  # true 表示默认开启深色模式
  # false 表示默认关闭深色模式
  # auto 表示跟随系统深浅色
  enable: auto # true 默认深色，false 默认浅色，auto 跟随系统

########################################
# 访问统计
########################################

baidu_analytics: false  # 百度统计 ID，false 关闭
google_analytics: false  # Google Analytics ID
clarity: false  # Microsoft Clarity ID

########################################
# Markdown 显示
########################################

# Mermaid 流程图项目地址
mermaid:  # Mermaid 图表
  zoom: false # 是否允许缩放 Mermaid 图表

code_block:  # 代码块行为
  # 控制代码块默认是否展开
  # true 表示默认全部展开
  # false 表示默认全部折叠
  # 数字表示超过该行数则默认折叠
  expand: true  # 代码块默认展开

# 代码复制剪贴板文案
clipboard:  # 复制提示文案
  success:  # 复制成功多语言文案
    en: Copy successfully (*^▽^*)
    zh-CN: 复制成功 (*^▽^*)
    zh-TW: 複製成功 (*^▽^*)
    ja: コピー成功 (*^▽^*)
    pt-BR: Copiado com sucesso (*^▽^*)
  fail:  # 复制失败多语言文案
    en: Copy failed (ﾟ⊿ﾟ)ﾂ
    zh-CN: 复制失败 (ﾟ⊿ﾟ)ﾂ
    zh-TW: 複製失敗 (ﾟ⊿ﾟ)ﾂ
    ja: コピー失敗 (ﾟ⊿ﾟ)ﾂ
    pt-BR: Falha ao copiar (ﾟ⊿ﾟ)ﾂ
  copyright:
    enable: false
    count: 50 # 复制超过该字符数时附加版权声明
    license_type: by-nc-sa # CC 协议类型链接

math:  # 数学公式引擎
  katex:  # KaTeX 配置
    enable: true  # 启用打字机
  mathjax:  # MathJax 配置
    enable: false
    options: # MathJax 配置文档
    # 配置须放数组中以防 Hugo 将键转为小写
      [
        {
          tex:
            {
              tags: "ams",  # MathJax 配置项
              useLabelIds: true,
              inlineMath: [["$", "$"], ['\\(', '\\)']],  # MathJax 配置项
              displayMath: [["$$", "$$"], ['\\[', '\\]']],  # MathJax 配置项
              processEscapes: true,
              processEnvironments: true,
              autoload: { color: [], colorv2: ["color"] },  # MathJax 加载配置
              packages: { "[+]": ["noerrors"] },  # MathJax 加载配置
            },
          options:
            {
              skipHtmlTags:  # MathJax 渲染选项
                ["script", "noscript", "style", "textarea", "pre", "code"],
              ignoreHtmlClass: "tex2jax_ignore",  # MathJax 渲染选项
              processHtmlClass: "tex2jax_process",  # MathJax 渲染选项
            },
          loader: { load: ["input/asciimath", "[tex]/noerrors"] },  # MathJax 加载配置
        },
      ]

# 段落锚点
# 为正文段落和列表项注入可跳转锚点
# 在 Markdown 中写 {#anchor-xxx} 生成锚点
anchor:  # 锚点配置
  # 显式锚点配置
  explicit:  # 显式锚点
    # 是否解析 Markdown 中的 {#anchor-xxx}
    enable: false
    # 锚点匹配占位符，一般无需修改
    marker: "{#anchor-"
    # 生成锚点 id 的前缀
    prefix: "anchor-"
  # 自动锚点配置
  auto:  # 自动锚点
    # 是否为段落自动生成锚点 id
    enable: false
    # 自动锚点 id 的最大长度
    length: 60

########################################
# 评论系统
########################################

# 评论系统全局控制
# 可同时启用多个评论系统
# 加载顺序：用户选择 → default
# 其后为各评论系统依次加载
comment:  # 评论全局
  # 评论区标题文案
  title:  # 评论标题
    en: Leave a comment  # 评论标题文案
    zh-CN: 说些什么吧！  # 评论标题文案
    zh-TW: 說些什麼吧！
    ja: コメントを残す  # 评论标题文案
    pt-BR: Deixe um comentário  # 评论标题文案
  default: waline # 多评论系统并存时的默认项

# Valine 评论，见 valine.js.org
# Valine 版本 1.5.1
# notify 与 verify 已废弃
valine:  # Valine 评论
  enable: false # 使用 Valine 时设为 true
  appId: # LeanCloud 应用 App ID
  appKey: # LeanCloud 应用 App Key
  pageSize: 10 # 评论列表每页条数
  avatar: mp # Gravatar 头像风格
  # lang 已废弃，使用 html.lang
  placeholder: Just go go # Valine 评论框占位文字
  guest_info: nick,mail,link # Valine 评论者信息字段
  recordIP: true # 是否记录评论者 IP
  highlight: true # 是否高亮评论中的代码
  visitor: false # 是否显示访客数
  serverURLs: # LeanCloud 国际版 Server URL

# Waline 官网
waline:  # Waline 评论
  enable: false  # 是否启用（本行含义视上下文而定）
  serverURL:
  # lang 已废弃，使用 html.lang
  locale: {} # https://waline.js.org/guide/features/i18n.html#%E8%87%AA%E5%AE%9A%E4%B9%89%E8%AF%AD%E8%A8%80
  emoji:  # Waline 表情包地址
    - https://unpkg.com/@waline/emojis@1.2.0/weibo
    - https://unpkg.com/@waline/emojis@1.2.0/alus
    - https://unpkg.com/@waline/emojis@1.2.0/bilibili
    - https://unpkg.com/@waline/emojis@1.2.0/qq
    - https://unpkg.com/@waline/emojis@1.2.0/tieba
    - https://unpkg.com/@waline/emojis@1.2.0/tw-emoji
  meta:  # 评论者可选字段
    - nick
    - mail
    - link
  requiredMeta:  # 评论必填字段
    - nick
    - mail
  wordLimit: 0
  pageSize: 10
  pageview: true

# Twikoo 官网
twikoo:  # Twikoo 评论
  enable: false  # 是否启用（本行含义视上下文而定）
  envId: # 腾讯云环境填 envId；Vercel 环境填地址（https://xxx.vercel.app）
  region:

# Gitalk 中文文档
gitalk:  # Gitalk 评论
  enable: false  # 是否启用（本行含义视上下文而定）
  clientID:
  clientSecret:
  repo:
  owner:
  admin:
  md5: false

# Giscus 中文站
giscus:  # Giscus 评论
  enable: false  # 是否启用（本行含义视上下文而定）
  repo:
  repoId:
  category:
  categoryId:
  mapping: mapping
  strict: 0
  reactionsEnabled: 1
  emitMetadata: 0
  inputPosition: bottom
  theme:
    light:
    dark:

# Disqus 官网
disqus:  # Disqus 评论
  enable: false  # 是否启用（本行含义视上下文而定）
  shortname: # Disqus 站点 shortname
  count: true  # 显示全站字数与阅读时间

# Utterances 官网
utterances:  # Utterances 评论
  enable: false  # 是否启用（本行含义视上下文而定）
  repo: owner/repo # 改为你的 GitHub 用户名/评论仓库名
  issue_term: title
  theme: auto # auto means to automatically adapt to dark and light themes, you can also use specific themes like github-light, github-dark, preferred-color-scheme, etc.

# Beaudar 官网
beaudar:  # Beaudar 评论
  enable: false  # 是否启用（本行含义视上下文而定）
  repo: owner/repo # 改为你的 GitHub 用户名/评论仓库名
  branch: main # 存储评论的仓库分支，默认 main
  issue_term: title # Issue 与页面的映射方式
  issue_number:
  theme: auto # auto means to automatically adapt to dark and light themes, you can also use specific themes like github-light, github-dark, preferred-color-scheme, etc.
  label:
  input_position: top # 评论输入框位置：顶部或底部
  comment_order: desc # 评论排序：asc 旧在前，desc 新在前
  keep_theme: # 是否将主题偏好存入 sessionStorage
  loading: # 点击加载图标是否跳转官网

########################################
# 站内搜索
########################################

algolia_search:  # Algolia 搜索
  enable: false  # 是否启用（本行含义视上下文而定）
  appID:
  apiKey:
  indexName:
  hits:  # 搜索结果配置
    per_page: 10

########################################
# 动画与特效
########################################

preloader:  # 页面加载动画
  enable: true  # 显示三角徽标
  text:  # 加载提示多语言文案
    zh-CN: 少女祈祷中...
    zh-TW: 少女祈禱中...
    en: Loading...
    ja: 少女祈祷中...
    pt-BR: Carregando...
  icon: # 默认内联 SVG 加载图标，可改为图片 URL
  rotate: true # 加载图标是否旋转

# AOS 滚动动画库
animation:  # AOS 入场动画
  enable: true  # 显示三角徽标
  options:  # 动画分区配置
    header:
      title: slide-up
      subTitle: slide-down
    home:
      post: fade-up
      widget: fade-up
      sidebar: fade-up
    article:
      whole: fade-up
      date: zoom-in
      category: zoom-in
      tag: zoom-in
      comment: zoom-in
      reading: zoom-in
      nav: fade-up
    archive:
      whole: fade-up
      tag: zoom-in
      category: zoom-in
      section: fade-up
      nav: fade-up

# 鼠标烟花特效库
firework:  # 鼠标烟花
  enable: true  # 显示三角徽标
  disable_on_mobile: false
  options:  # 动画分区配置
    excludeElements: ["a", "button"]
    particles:  # 烟花粒子组
      - shape: circle
        move: ["emit"]
        easing: easeOutExpo
        colors: ["var(--red-1)", "var(--red-2)", "var(--red-3)", "var(--red-4)"]
        number: 20
        duration: [1200, 1800]
        shapeOptions:
          radius: [16, 32]
          alpha: [0.3, 0.5]
      - shape: circle
        move: ["diffuse"]
        easing: easeOutExpo
        colors: ["var(--red-0)"]
        number: 1
        duration: [1200, 1800]
        shapeOptions:
          radius: 20
          alpha: [0.2, 0.5]
          lineWidth: 6

