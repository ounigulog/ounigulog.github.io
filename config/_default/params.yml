# 文章末尾显示版权卡片
article_copyright:  # 文末版权卡
  enable: false  # 是否启用（本行含义视上下文而定）
  content:  # 分类卡片内容
    author: true
    link: true
    title: false
    date: false
    updated: false
    license: true
    license_type: by-nc-sa # CC 协议类型链接

# 回到顶部按钮
top:  # 回到顶部
  enable: true  # 显示三角徽标
